<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard • Malik Service</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="brand"><img src="" class="brand-logo" style="height:32px;"> <span class="brand-text">Loading...</span></div>
    <nav class="side-nav">
      <a href="#" class="active" onclick="showTab('order')"><i class="fa-solid fa-plus"></i> Pesan Baru</a>
      <a href="#" onclick="showTab('riwayat')"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</a>
      <a href="#" onclick="showTab('chat')"><i class="fa-solid fa-comments"></i> Chat Admin</a>
    </nav>
    <div style="padding-top:20px; border-top:1px solid var(--border);">
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;" id="userName">User</p>
      <button class="btn btn-outline btn-block" onclick="logout()">Keluar</button>
    </div>
  </aside>

  <main class="main">
    <!-- ORDER TAB -->
    <div id="tab-order" class="card">
      <h2 style="margin-bottom:24px;">Pesan Layanan Baru</h2>
      <form id="formOrder" class="grid-2">
        <div class="field"><label>Nama</label><input type="text" id="orderNama" required></div>
        <div class="field"><label>Telepon/WA</label><input type="tel" id="orderTelepon" required></div>
        <div class="field"><label>Alamat Lengkap</label><input type="text" id="orderAlamat" required></div>
        <div class="field"><label>Pilih Layanan</label><select id="orderLayanan" required></select></div>
        <div class="field" style="grid-column: 1/-1;"><label>Catatan</label><textarea id="orderCatatan" rows="2"></textarea></div>
        <button type="submit" class="btn btn-primary" style="grid-column: 1/-1;">Kirim Pesanan</button>
      </form>
    </div>

    <!-- RIWAYAT TAB -->
    <div id="tab-riwayat" class="card hidden">
      <h2 style="margin-bottom:24px;">Riwayat Pesanan</h2>
      <div id="riwayatList" style="display:flex; flex-direction:column; gap:16px;"></div>
    </div>

    <!-- CHAT TAB -->
    <div id="tab-chat" class="card hidden">
      <h2 style="margin-bottom:24px;">Chat dengan Admin</h2>
      <div class="chat-container">
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Ketik pesan..." style="flex:1; padding:12px; border-radius:8px; border:1px solid var(--border);">
          <button class="btn btn-primary" id="btnSendChat">Kirim</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/user.js"></script>
</body>
</html>
