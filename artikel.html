<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel & Tips • Malik Service</title>
  <meta name="description" content="Kumpulan artikel dan tips seputar perawatan laptop, HP, dan servis elektronik dari teknisi profesional Malik Service.">
  <link rel="canonical" href="https://malikservice.my.id/artikel.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7329937149040108" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  
  <style>
    body { background: #f7f9fc; color: #101828; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    .page-wrap { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 32px; align-items: start; }
    @media (max-width: 1024px) { .page-wrap { grid-template-columns: 1fr; } }
    .article-card { background: #fff; border-radius: 20px; border: 1px solid #e8edf3; overflow: hidden; margin-bottom: 24px; }
    
    /* Gambar tidak terpotong */
    .article-card .article-image { width: 100%; height: auto; max-height: 500px; object-fit: contain; display: block; background: #f8fafc; }
    
    .article-card .article-body { padding: 32px; }
    .article-card .article-category { display: inline-block; padding: 6px 14px; background: #e0e7ff; color: #4f46e5; border-radius: 50px; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; letter-spacing: 0.5px; }
    .article-card h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 16px; line-height: 1.35; color: #101828; }
    .article-card .meta { font-size: 14px; color: #667085; display: flex; gap: 20px; margin-bottom: 28px; border-bottom: 1px solid #e8edf3; padding-bottom: 20px; }
    
    /* PERBAIKAN TIPOGRAFI KONTEN */
    .article-card .content { font-size: 1.05rem; line-height: 1.9; color: #334155; text-align: justify; word-wrap: break-word; }
    .article-card .content p { margin-bottom: 24px; }
    .article-card .content h2, .article-card .content h3, .article-card .content h4 { margin: 32px 0 16px; color: #101828; line-height: 1.4; }
    .article-card .content ul, .article-card .content ol { margin: 0 0 24px 24px; padding-left: 10px; }
    .article-card .content li { margin-bottom: 12px; line-height: 1.8; }
    .article-card .content img { max-width: 100%; height: auto; border-radius: 12px; margin: 24px 0; display: block; }
    .article-card .content blockquote { border-left: 4px solid #4f46e5; padding: 16px 20px; background: #f8fafc; margin: 24px 0; font-style: italic; color: #475467; border-radius: 0 8px 8px 0; }
    
    /* Sidebar */
    .sidebar { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 24px; }
    .widget { background: #fff; border-radius: 20px; padding: 24px; border: 1px solid #e8edf3; }
    .widget h3 { font-size: 1.1rem; margin-bottom: 16px; border-bottom: 2px solid #4f46e5; display: inline-block; padding-bottom: 8px; color: #101828; }
    .widget a { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #e8edf3; color: #101828; text-decoration: none; font-weight: 500; font-size: 14px; line-height: 1.6; transition: 0.2s; }
    .widget a:hover { color: #4f46e5; }
    .widget a:last-child { border-bottom: none; padding-bottom: 0; }
    .back-btn-wrap { padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e8edf3; }
    .back-btn-wrap a { color: #4f46e5; text-decoration: none; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
    .back-btn-wrap a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .article-card .article-body { padding: 20px; }
      .article-card h1 { font-size: 1.6rem; }
      .article-card .content { text-align: left; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar" style="position:sticky;top:0;background:#fff;z-index:1000;border-bottom:1px solid #e8edf3;padding:16px 0;">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto;padding:0 20px;">
      <a href="./index.html" class="brand" style="display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:20px;color:#101828;">
        <div style="width:40px;height:40px;background:#4f46e5;color:#fff;border-radius:10px;display:grid;place-items:center;"><i class="fa-solid fa-screwdriver-wrench"></i></div>
        Malik Service
      </a>
      <div style="display:flex;gap:24px;align-items:center;">
        <a href="./index.html" style="color:#667085;text-decoration:none;font-weight:600;">Beranda</a>
        <a href="./artikel.html" style="color:#4f46e5;text-decoration:none;font-weight:600;">Artikel</a>
        <a href="./login.html" style="color:#4f46e5;text-decoration:none;font-weight:800;padding:8px 18px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;">Masuk</a>
      </div>
    </div>
  </nav>

  <div class="page-wrap">
    <div id="artikelContainer">
      <p style="text-align:center;color:#667085; padding: 40px;"><i class="fa-solid fa-spinner fa-spin"></i> Memuat artikel...</p>
    </div>
    
    <aside class="sidebar">
      <div class="widget">
        <h3>Artikel Lainnya</h3>
        <div id="sidebarList"><p style="color:#667085;font-size:14px;">Memuat...</p></div>
      </div>
      <div class="widget" style="background:#4f46e5;color:#fff;text-align:center; border: none;">
        <h3 style="border-bottom:none;color:#fff; margin-bottom: 8px;">Butuh Bantuan?</h3>
        <p style="font-size:14px;opacity:.9;margin-bottom:20px; line-height: 1.6;">Konsultasikan masalah perangkat Anda dengan teknisi kami.</p>
        <a href="https://wa.me/6285713087659" style="background:#fff;color:#4f46e5;padding:12px;border-radius:8px;font-weight:700;display:block;text-decoration:none; border: none;">Chat WhatsApp</a>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase.js"></script>
  <script>
    const FALLBACK = 'https://images.unsplash.com/photo-1588508065123-287b28e013da?w=800&h=400&fit=crop';
    
    // Fungsi untuk merapikan teks mentah dari textarea lama (jika ada)
    function formatRawTextToHTML(rawText) {
      if (!rawText) return '';
      let clean = DOMPurify.sanitize(rawText, { USE_PROFILES: { html: true } });
      
      if (!clean.includes('<p>') && !clean.includes('<br>') && !clean.includes('<div>')) {
        const lines = clean.split('\n');
        clean = lines
          .map(line => line.trim())
          .filter(line => line.length > 0)
          .map(line => `<p>${line}</p>`)
          .join('');
      } 
      else {
        clean = clean.replace(/(<br\s*\/?>\s*){2,}/gi, '</p><p>');
        if (!clean.startsWith('<p>')) clean = '<p>' + clean;
        if (!clean.endsWith('</p>')) clean = clean + '</p>';
      }
      return clean;
    }

    (async () => {
      const container = document.getElementById('artikelContainer');
      const sidebar = document.getElementById('sidebarList');
      try {
        const { data: articles, error } = await supabaseClient.from('articles').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        
        if (!articles || articles.length === 0) {
          container.innerHTML = '<p style="text-align:center;color:#667085;padding:40px; background: #fff; border-radius: 20px; border: 1px solid #e8edf3;">Belum ada artikel dipublikasikan.</p>';
          sidebar.innerHTML = '<p style="color:#667085;font-size:14px;">Tidak ada artikel lain.</p>';
          return;
        }
        
        const params = new URLSearchParams(window.location.search);
        const idTerpilih = params.get('id');
        let mainArt = articles[0];
        if (idTerpilih) {
          const found = articles.find(a => String(a.id) === String(idTerpilih));
          if (found) mainArt = found;
        }

        document.title = (mainArt.title || 'Artikel') + ' • Malik Service';
        const canonical = document.querySelector('link[rel="canonical"]');
        if (canonical && idTerpilih) canonical.href = 'https://malikservice.my.id/artikel.html?id=' + encodeURIComponent(idTerpilih);

        const imgUrl = mainArt.image_url ? escapeHTML(mainArt.image_url) : FALLBACK;
        const date = new Date(mainArt.created_at).toLocaleDateString('id-ID', { year:'numeric', month:'long', day:'numeric' });
        const safeTitle = escapeHTML(mainArt.title || 'Tanpa Judul');
        
        // Gunakan fungsi perapian teks
        const safeContent = formatRawTextToHTML(mainArt.content || '');

        const backBtn = idTerpilih ? `
          <div class="back-btn-wrap">
            <a href="./artikel.html"><i class="fa-solid fa-arrow-left"></i> Kembali ke Daftar Artikel</a>
          </div>` : '';

        container.innerHTML = `
          <article class="article-card">
            ${backBtn}
            <img src="${imgUrl}" class="article-image" onerror="this.src='${FALLBACK}'" alt="${safeTitle}">
            <div class="article-body">
              <span class="article-category">${escapeHTML(mainArt.category || 'Tips')}</span>
              <h1>${safeTitle}</h1>
              <div class="meta">
                <span><i class="fa-regular fa-calendar"></i> ${date}</span>
                <span><i class="fa-regular fa-user"></i> ${escapeHTML(mainArt.author || 'Admin')}</span>
              </div>
              <div class="content">${safeContent}</div>
            </div>
          </article>`;

        const others = articles.filter(a => a.id !== mainArt.id).slice(0, 5);
        sidebar.innerHTML = others.length > 0
          ? others.map(a => `
              <a href="./artikel.html?id=${encodeURIComponent(a.id)}">
                <i class="fa-solid fa-newspaper" style="color:#4f46e5;margin-top:4px;flex-shrink:0;"></i>
                <span>${escapeHTML(a.title)}</span>
              </a>`).join('')
          : '<p style="color:#667085;font-size:14px;">Tidak ada artikel lain.</p>';
          
      } catch (err) {
        container.innerHTML = `<p style="color:red;text-align:center; padding: 20px; background: #fff; border-radius: 12px;">Gagal memuat artikel: ${escapeHTML(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
